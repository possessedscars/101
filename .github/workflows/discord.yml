name: 101 GitHub Updates

on:
  push:
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send Discord Notification
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}

        run: |
          COMMIT_MESSAGE="${{ github.event.head_commit.message }}"
          AUTHOR="${{ github.actor }}"
          BRANCH="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          COMMIT_URL="${{ github.event.head_commit.url }}"

          TYPE="📦 Atualização"

          if [[ "$COMMIT_MESSAGE" == feat:* ]]; then
            TYPE="✨ Nova Funcionalidade"
          elif [[ "$COMMIT_MESSAGE" == fix:* ]]; then
            TYPE="🐛 Correção"
          elif [[ "$COMMIT_MESSAGE" == style:* ]]; then
            TYPE="🎨 Alteração Visual"
          elif [[ "$COMMIT_MESSAGE" == perf:* ]]; then
            TYPE="⚡ Performance"
          elif [[ "$COMMIT_MESSAGE" == docs:* ]]; then
            TYPE="📚 Documentação"
          elif [[ "$COMMIT_MESSAGE" == refactor:* ]]; then
            TYPE="♻️ Refatoração"
          elif [[ "$COMMIT_MESSAGE" == hotfix:* ]]; then
            TYPE="🚑 Hotfix"
          fi

          jq -n \
            --arg type "$TYPE" \
            --arg message "$COMMIT_MESSAGE" \
            --arg author "$AUTHOR" \
            --arg branch "$BRANCH" \
            --arg repo "$REPO" \
            --arg url "$COMMIT_URL" \
            '{
              username: "101-Bot",
              embeds: [
                {
                  title: "🚀 Website Atualizado",
                  description: ("## " + $type + "\n\n**" + $message + "**"),
                  color: 16777215,
                  url: $url,
                  fields: [
                    {
                      name: "👤 Developer",
                      value: $author,
                      inline: true
                    },
                    {
                      name: "🌿 Branch",
                      value: $branch,
                      inline: true
                    },
                    {
                      name: "📦 Repositório",
                      value: $repo,
                      inline: true
                    }
                  ],
                  footer: {
                    text: "1Ø1 Community • GitHub"
                  }
                }
              ]
            }' > payload.json

          curl \
            -H "Content-Type: application/json" \
            -X POST \
            -d @payload.json \
            "$WEBHOOK"
